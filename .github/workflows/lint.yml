name: Lint & Type Check

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dev dependencies
        run: pip install -e ".[dev]"

      - name: Ruff (lint)
        run: ruff check .

      - name: Mypy (type check)
        run: mypy src/scout

      - name: Validate action + workflow YAML
        # actionlint (below) checks workflow files but not action.yml files, so parse them here.
        run: |
          python - <<'PY'
          import glob
          import yaml
          targets = [
              "action.yml",
              *sorted(glob.glob("actions/*/action.yml")),
              *sorted(glob.glob(".github/workflows/*.yml")),
          ]
          for f in targets:
              with open(f) as fh:
                  yaml.safe_load(fh)
              print(f"ok: {f}")
          PY

  actionlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Actionlint
        uses: docker://rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667
        with:
          args: -color

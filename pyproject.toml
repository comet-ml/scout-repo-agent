[project]
name = "scout-repo-agent"
version = "0.1.0"
description = "Add your description here"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.40.0",
    "PyGithub>=2.0",
    "requests>=2.28",
    "opik>=1.0",
    "python-dotenv>=1.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "mypy>=1.11",
]

[tool.ruff]
target-version = "py312"

[tool.mypy]
python_version = "3.12"
# Third-party SDKs (opik, PyGithub, requests) ship partial or no type info; don't
# fail on their missing stubs. We still type-check our own modules.
ignore_missing_imports = true
